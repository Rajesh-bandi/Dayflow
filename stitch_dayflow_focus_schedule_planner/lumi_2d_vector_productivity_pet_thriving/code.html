<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Background Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#73E2B3" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#101114" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Body Gradient -->
    <linearGradient id="lumiBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- Belly Gradient -->
    <linearGradient id="lumiBelly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EDE9FE"/>
      <stop offset="100%" stop-color="#DDD6FE"/>
    </linearGradient>

    <!-- Cheek Blush -->
    <radialGradient id="blushGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Sprout Gradient -->
    <linearGradient id="sproutGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#73E2B3"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop Aura -->
  <circle cx="200" cy="200" r="170" fill="url(#ambientGlow)"/>

  <!-- Sparkles / Floating Magic Elements -->
  <g opacity="0.85">
    <!-- Star 1 -->
    <path d="M 80 130 Q 90 130 90 120 Q 90 130 100 130 Q 90 130 90 140 Q 90 130 80 130 Z" fill="#73E2B3" filter="url(#softGlow)"/>
    <!-- Star 2 -->
    <path d="M 310 110 Q 318 110 318 102 Q 318 110 326 110 Q 318 110 318 118 Q 318 110 310 110 Z" fill="#FDE047"/>
    <!-- Small star 3 -->
    <path d="M 320 250 Q 325 250 325 245 Q 325 250 330 250 Q 325 250 325 255 Q 325 250 320 250 Z" fill="#A78BFA"/>
    <!-- Mint orb -->
    <circle cx="95" cy="235" r="4" fill="#73E2B3" opacity="0.7"/>
    <circle cx="295" cy="180" r="3" fill="#A78BFA" opacity="0.6"/>
  </g>

  <!-- Ground Shadow -->
  <ellipse cx="200" cy="335" rx="90" ry="16" fill="#090A0D" opacity="0.5"/>
  <ellipse cx="200" cy="334" rx="65" ry="10" fill="#191B20" opacity="0.8"/>

  <!-- Main Body Group -->
  <g id="character">
    <!-- Ears (Soft rounded bunny/creature ears) -->
    <!-- Left Ear -->
    <path d="M 135 150 C 100 70 125 35 150 45 C 172 55 170 110 160 150 Z" fill="url(#lumiBody)"/>
    <!-- Left Inner Ear -->
    <path d="M 138 135 C 118 75 132 55 146 62 C 160 70 158 108 152 135 Z" fill="#F472B6" opacity="0.45"/>

    <!-- Right Ear (Slightly tilted, playful) -->
    <path d="M 240 150 C 255 110 270 55 292 48 C 314 40 325 75 285 150 Z" fill="url(#lumiBody)"/>
    <!-- Right Inner Ear -->
    <path d="M 248 135 C 262 105 272 65 288 60 C 300 55 306 80 275 135 Z" fill="#F472B6" opacity="0.45"/>

    <!-- Head & Body (Plump, round, cute unified organic silhouette) -->
    <path d="M 120 240 C 105 180 135 130 200 130 C 265 130 295 180 280 240 C 295 290 275 325 200 325 C 125 325 105 290 120 240 Z" fill="url(#lumiBody)"/>

    <!-- Sprout of Focus & Growth on head -->
    <path d="M 200 130 C 200 100 206 90 214 85 C 224 80 230 92 216 100 C 206 106 203 118 202 130 Z" fill="url(#sproutGrad)"/>
    <path d="M 200 115 C 190 105 178 108 178 116 C 178 124 190 123 200 120 Z" fill="#73E2B3"/>

    <!-- Light Chest / Belly Patch -->
    <ellipse cx="200" cy="265" rx="52" ry="46" fill="url(#lumiBelly)"/>

    <!-- Soft Cheeks Blush -->
    <circle cx="152" cy="228" r="14" fill="url(#blushGlow)"/>
    <circle cx="248" cy="228" r="14" fill="url(#blushGlow)"/>

    <!-- Big Expressive Luminous Eyes -->
    <!-- Left Eye -->
    <g>
      <ellipse cx="165" cy="208" rx="13" ry="16" fill="#18181B"/>
      <!-- Eye Catchlight & Color Ring -->
      <ellipse cx="165" cy="206" rx="10" ry="12" fill="#2E1065"/>
      <circle cx="162" cy="202" r="5" fill="#FFFFFF"/>
      <circle cx="169" cy="214" r="2.5" fill="#73E2B3"/>
    </g>

    <!-- Right Eye (Sparkling happy) -->
    <g>
      <ellipse cx="235" cy="208" rx="13" ry="16" fill="#18181B"/>
      <!-- Eye Catchlight & Color Ring -->
      <ellipse cx="235" cy="206" rx="10" ry="12" fill="#2E1065"/>
      <circle cx="232" cy="202" r="5" fill="#FFFFFF"/>
      <circle cx="239" cy="214" r="2.5" fill="#73E2B3"/>
    </g>

    <!-- Tiny Cute Nose -->
    <ellipse cx="200" cy="216" rx="3.5" ry="2.5" fill="#7C3AED"/>

    <!-- Adorable Curved Smile -->
    <path d="M 193 223 Q 200 230 207 223" fill="none" stroke="#6D28D9" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Tiny Paws / Hands resting sweetly on belly -->
    <ellipse cx="170" cy="262" rx="11" ry="8" fill="#DDD6FE" transform="rotate(-15 170 262)"/>
    <ellipse cx="230" cy="262" rx="11" ry="8" fill="#DDD6FE" transform="rotate(15 230 262)"/>

    <!-- Tiny Feet -->
    <ellipse cx="162" cy="320" rx="16" ry="10" fill="#8B5CF6"/>
    <ellipse cx="238" cy="320" rx="16" ry="10" fill="#8B5CF6"/>
    <ellipse cx="162" cy="318" rx="10" ry="6" fill="#DDD6FE"/>
    <ellipse cx="238" cy="318" rx="10" ry="6" fill="#DDD6FE"/>
  </g>
</svg>
